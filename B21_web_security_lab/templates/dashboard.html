<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Comment System</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        width: 400px;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    h3 {
        margin-top: 20px;
        margin-bottom: 10px;
        color: #444;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    input:focus {
        border-color: #667eea;
        outline: none;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #667eea;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background-color: #5563c1;
    }

    #comments {
        margin-top: 15px;
        max-height: 200px;
        overflow-y: auto;
        border-top: 1px solid #eee;
        padding-top: 10px;
    }

    .comment {
        background: #f5f5f5;
        padding: 8px;
        border-radius: 5px;
        margin-bottom: 8px;
        font-size: 14px;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Comment System: What could go wrong</h2>

    <h3>Add Comment</h3>
    <span>flag = LABFALG{flagGetIn}</span>
    <input id="comment" placeholder="Enter comment">
    <button onclick="sendComment()">Submit</button>

    <h3>All Comments</h3>
    <div id="comments"></div>
</div>

<script src="/static/app.js"></script>

</body>
</html>
